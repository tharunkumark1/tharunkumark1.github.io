<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": {{ page.url | replace: "/index.html", "/" | absolute_url | jsonify }},
  "name": {{ page.title | default: site.title | jsonify }},
  "description": {{ page.excerpt | default: site.description | strip_newlines | jsonify }},
  {% if site.og_image %}
  "image": {{ site.og_image | absolute_url | jsonify }},
  {% endif %}
  "mainEntity": {
    "@type": "Person",
    "name": {{ site.profile.name | default: site.social.name | default: site.name | jsonify }},
    {%- if site.author.avatar %}
    "image": {{ site.author.avatar | absolute_url | jsonify }},
    {%- endif %}
    "url": {{ '/' | absolute_url | jsonify }}{% if site.author.email %},
    "email": {{ site.author.email | prepend: "mailto:" | jsonify }}{% endif %}{% if site.profile.job_title %},
    "jobTitle": {{ site.profile.job_title | jsonify }}{% endif %}{% if site.profile.address %},
    "address": {
      "@type": "PostalAddress",
      "addressLocality": {{ site.profile.address | jsonify }},
      "addressCountry": {{ site.profile.address_country | default: "IN" | jsonify }}
    }{% endif %}{% if site.author.links %},
    "sameAs": [
      {%- for link in site.author.links -%}
      {%- if link.url and link.url contains "://" %}
      {{ link.url | jsonify }}{%- unless forloop.last %}, {% endunless %}
      {%- endif -%}
      {%- endfor -%}
    ]{% endif %}{% if site.profile.affiliations %},
    "worksFor": [
      {%- for org in site.profile.affiliations -%}
      {
        "@type": "Organization",
        "name": {{ org.name | jsonify }}
      }{%- unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ]{% endif %}{% if site.profile.alumni_of %},
    "alumniOf": [
      {%- for school in site.profile.alumni_of -%}
      {
        "@type": "CollegeOrUniversity",
        "name": {{ school.name | jsonify }}
      }{%- unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ]{% endif %}{% if site.profile.knows_about %},
    "knowsAbout": {{ site.profile.knows_about | jsonify }}{% endif %}{% if site.profile.has_credential %},
    "hasCredential": [
      {%- for cred in site.profile.has_credential -%}
      {
        "@type": "EducationalOccupationalCredential",
        "name": {{ cred.name | jsonify }}
      }{%- unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ]{% endif %}
  }
}
</script>
