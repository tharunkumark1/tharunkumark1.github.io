# Site Settings
locale                   : "en-US"
direction                : # "ltr" (default), "rtl"
title                    : "Tharun Kumar Ksheerasagar"
name                     : "Tharun Kumar Ksheerasagar"
description              : "Senior Architect in system architecture and hardware simulation. Pre-silicon validation and AI infrastructure at NVIDIA, AMD, and Samsung."
url                      : "https://tharunkumark1.github.io"
baseurl                  :
repository               : "tharunkumark1/tharunkumark1.github.io"
teaser                   :
logo                     :
words_per_minute         : 200
enable_copy_code_button  :
copyright                : "Tharun Kumar Ksheerasagar"
copyright_url            :
search                   : false
breadcrumbs              : false

# Social preview card (1200x630, generated by tools/generate_og_image.py)
og_image                 : "/assets/images/og-profile.png"
og_image_alt             : "Tharun Kumar Ksheerasagar — Senior Architect in system architecture and hardware simulation, based in Hyderabad, India."

# Structured data for the JSON-LD block in _includes/schema.html
profile:
  name                   : "Tharun Kumar Ksheerasagar"
  job_title              : "Senior Architect"
  address                : "Hyderabad"
  address_country        : "IN"
  affiliations:
    - name: "NVIDIA"
    - name: "AMD (Xilinx)"
    - name: "Samsung"
  alumni_of:
    - name: "BITS Pilani (WILP)"
    - name: "NIT Warangal"
  knows_about:
    - "System architecture"
    - "Hardware simulation"
    - "Pre-silicon validation"
    - "SystemC"
    - "C++"
    - "Python"
    - "Hardware-software co-design"
    - "FPGA prototyping"
    - "AI infrastructure"
    - "AI accelerator architecture"
    - "Performance analysis"
  has_credential:
    - name: "GPU Architectures and Programming (NPTEL)"
    - name: "Multi-Core Computer Architecture (NPTEL)"
    - name: "Operating System Fundamentals (NPTEL)"
    - name: "Modern C++ Concurrency in Depth (Udemy)"

# Drop a Google Search Console token here to verify the property:
# google_site_verification : "your-token"

# No posts on this site, so hide the feed link and skip feed generation.
atom_feed:
  hide                   : true

# Theme
minimal_mistakes_skin    : "default"

# Social
social:
  type                   : Person
  name                   : "Tharun Kumar Ksheerasagar"
  links:
    - "https://linkedin.com/in/tharun-kumar-ksheerasagar"
    - "https://github.com/tharunkumark1"

# Site Author
author:
  name             : "Tharun Kumar Ksheerasagar"
  avatar           : "/assets/images/profile.jpg"
  bio              : "Senior Architect in system architecture and hardware simulation."
  location         : "Hyderabad, India"
  email            : "tharunkumark1@gmail.com"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:tharunkumark1@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin-in"
      url: "https://linkedin.com/in/tharun-kumar-ksheerasagar"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/tharunkumark1"
    - label: "IEEE WiSPNET paper"
      icon: "fas fa-fw fa-file-alt"
      url: "https://doi.org/10.1109/WiSPNET.2016.7566577"

# Site Footer
# No links here: Email / LinkedIn / GitHub already appear on the hero buttons
# and in the contact section, so the footer's follow row was pure duplication.
# Keep `since` so the copyright renders a year range.
footer:
  since: "2016"

# Exclude files from the build
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - "vendor"
  - ".asset-cache"
  - ".bundle"
  - ".jekyll-assets-cache"
  - ".jekyll-cache"
  - ".sass-cache"
  - "assets/js/plugins"
  - "assets/js/_main.js"
  - "assets/js/vendor"
  - "Gemfile"
  - "LICENSE"
  - "README.md"
  - "node_modules"
  - "package.json"
  - "tools"
keep_files:
  - ".git"
  - ".svn"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations: ['import']

# Outputting
permalink: /:categories/:title/
timezone: Asia/Kolkata

# Plugins
plugins:
  - jekyll-include-cache
  - jekyll-sitemap

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: single
      read_time: false
      share: false
      related: false
      comments: false
